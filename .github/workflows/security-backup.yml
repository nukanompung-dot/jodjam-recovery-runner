name: Security backup
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preflight, capture, health]
        default: preflight
        required: true
# Schedule is deliberately ABSENT. Enabling it is a later reviewed operator change.
permissions:
  contents: read
concurrency:
  group: security-backup-main
  cancel-in-progress: false
jobs:
  inspect-trust:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - run: node scripts/security/verify-export-manifest.mjs
      - name: Inspect actual protected main and existing environment
        env:
          GH_PROTECTION_METADATA_TOKEN: ${{ secrets.RECOVERY_PROTECTION_READ_TOKEN }}
          RECOVERY_POLICY_REVIEWED_SHA: ${{ vars.RECOVERY_POLICY_REVIEWED_SHA }}
          RECOVERY_POLICY_REVIEWED_AT: ${{ vars.RECOVERY_POLICY_REVIEWED_AT }}
        run: node scripts/security/verify-ci-protection.mjs
  backup:
    needs: inspect-trust
    if: github.ref == 'refs/heads/main' && (inputs.mode == 'preflight' || (vars.RECOVERY_READY == 'true' && (inputs.mode == 'capture' || (github.event_name == 'schedule' && github.event.schedule == '17 */12 * * *'))))
    environment: security-backup
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Install signed PostgreSQL client and age packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ca-certificates curl gnupg age
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$RUNNER_TEMP/pgdg.asc"
          fingerprint="$(gpg --show-keys --with-colons "$RUNNER_TEMP/pgdg.asc" | awk -F: '$1=="fpr" {print $10; exit}')"
          test "$fingerprint" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          sudo install -m 0644 "$RUNNER_TEMP/pgdg.asc" /usr/share/keyrings/pgdg.asc
          echo 'deb [signed-by=/usr/share/keyrings/pgdg.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
      - name: Capture or inspect backend readiness
        shell: bash
        env:
          RECOVERY_JOB_MODE: ${{ inputs.mode || 'capture' }}
          RECOVERY_BACKUP_ENABLED: 'true'
          RECOVERY_OAUTH_PUBLISHING_STATUS: production
          RECOVERY_DATABASE_ROLE: security_backup_reader
          RECOVERY_PG_BIN: /usr/lib/postgresql/17/bin
          RECOVERY_APP_ORIGIN: ${{ secrets.RECOVERY_APP_ORIGIN }}
          RECOVERY_SOURCE_PROJECT_REF: ${{ secrets.RECOVERY_SOURCE_PROJECT_REF }}
          RECOVERY_RUNNER_SECRET: ${{ secrets.RECOVERY_RUNNER_SECRET }}
          RECOVERY_DRIVE_TARGET_JSON: ${{ secrets.RECOVERY_DRIVE_TARGET_JSON }}
          RECOVERY_DRIVE_CLIENT_ID: ${{ secrets.RECOVERY_DRIVE_CLIENT_ID }}
          RECOVERY_DRIVE_CLIENT_SECRET: ${{ secrets.RECOVERY_DRIVE_CLIENT_SECRET }}
          RECOVERY_DRIVE_REFRESH_TOKEN: ${{ secrets.RECOVERY_DRIVE_REFRESH_TOKEN }}
          RECOVERY_DATABASE_URL: ${{ secrets.RECOVERY_DATABASE_URL }}
          RECOVERY_DATABASE_CA_BASE64: ${{ secrets.RECOVERY_DATABASE_CA_BASE64 }}
        run: |
          set -euo pipefail
          case "$RECOVERY_JOB_MODE" in
            preflight) node scripts/recovery/backup.mjs --check ;;
            capture) node scripts/recovery/backup.mjs ;;
            *) exit 1 ;;
          esac
      - name: Check recovery health without public runtime details
        if: always() && inputs.mode == 'capture'
        env:
          RECOVERY_APP_ORIGIN: ${{ secrets.RECOVERY_APP_ORIGIN }}
          RECOVERY_SOURCE_PROJECT_REF: ${{ secrets.RECOVERY_SOURCE_PROJECT_REF }}
          RECOVERY_RUNNER_SECRET: ${{ secrets.RECOVERY_RUNNER_SECRET }}
        run: node scripts/recovery/health.mjs
      # Never upload artifacts: archives, object data, manifests, receipts, credentials and keys remain private.

  health-only:
    needs: inspect-trust
    if: github.ref == 'refs/heads/main' && (inputs.mode == 'health' || (vars.RECOVERY_READY == 'true' && github.event_name == 'schedule' && github.event.schedule == '7 * * * *'))
    environment: security-backup
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Health check with gateway authority only
        env:
          RECOVERY_APP_ORIGIN: ${{ secrets.RECOVERY_APP_ORIGIN }}
          RECOVERY_SOURCE_PROJECT_REF: ${{ secrets.RECOVERY_SOURCE_PROJECT_REF }}
          RECOVERY_RUNNER_SECRET: ${{ secrets.RECOVERY_RUNNER_SECRET }}
        run: node scripts/recovery/health.mjs
