name: Public runner CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    name: public-runner-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - run: node scripts/security/verify-export-manifest.mjs
      - run: node --test scripts/recovery/unit.test.mjs scripts/security/verify-ci-protection.test.mjs scripts/security/verify-export-manifest.test.mjs
      # No secrets, dependencies, artifacts, application checkout or publishing permissions.
